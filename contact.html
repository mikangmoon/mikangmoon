<style>





/* Night-time Frutiger Aero: one fixed theme, so tokens are not remapped for light/dark */
:root{
  --night:#050F3A; --navy:#06185A; --blue:#0032DB; --aero:#0689E4; --picton:#00BFFF; --sky:#87CEEB;
  --mint:#90EE90; --lime:#32CD32; --silver:#C0C8D0; --pink:#FFF0F8; --aqua:#E8F8FF;
  --ink:#0B2A6B; --sub:#3A4F8A; --accent:#FFE74C; --vermilion:#FF4000;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-behavior:smooth; scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0; background:var(--navy); color:var(--ink); font-family:'VT323',monospace; font-size:1rem; overflow-x:hidden;}
.pixel{font-family:'Press Start 2P',monospace;}
.read,.read-title{font-family:'Geist Pixel',ui-monospace,monospace; font-variation-settings:"ELSH" 1; font-weight:400;}
.read{font-size:1rem; line-height:1.6;}
.read-title{font-size:clamp(1.125rem,1rem + .5vw,1.375rem); line-height:1.3;}
/* Responsive type: body copy is 1rem (16px, follows the visitor's browser text size); headings and pixel labels scale fluidly with the viewport */
.text-lg,.text-xl{font-size:1rem !important; line-height:1.6 !important;}
h1.pixel{font-size:clamp(1.25rem,1rem + 1.2vw,1.75rem) !important; line-height:1.5 !important;}
h2.pixel{font-size:clamp(1.125rem,1rem + .8vw,1.5rem) !important;}
.text-\[10px\],.text-\[11px\],.win-name,.badge-done{font-size:clamp(10px,.55rem + .35vw,12px) !important;}
footer p.pixel{font-size:clamp(12px,.7rem + .4vw,14px) !important;}
img,.pixel-render{image-rendering:pixelated; image-rendering:crisp-edges;}
::selection{background:var(--accent); color:var(--navy);}
:focus-visible{outline:3px solid #fff; outline-offset:2px; box-shadow:0 0 0 6px var(--blue);}

/* Windows-style popup */
.win{background:var(--pink); border:4px solid var(--navy); border-radius:6px; overflow:hidden;
  box-shadow:0 0 0 3px var(--sky), 0 0 0 5px #fff, 8px 10px 0 rgba(0,0,0,.35);}
.win-title{display:flex; align-items:center; gap:10px; padding:8px 10px; color:var(--navy);
  background:linear-gradient(#8BE3FF,#3DB6F5 60%,#1AA3F2);}
.win-icon{width:16px; height:16px; background:#fff; border:3px solid var(--navy); flex:none;}
.win-name{font-family:'Press Start 2P',monospace; font-size:10px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.win-ctrls{display:flex; gap:4px; flex:none;}
.win-ctrls i{display:block; width:22px; height:20px; border:2px solid var(--navy); font:700 13px/16px system-ui,sans-serif; font-style:normal; text-align:center; color:var(--navy);
  background:linear-gradient(#fff,var(--silver));}
.win-ctrls i.x{background:linear-gradient(#FF7A4D,var(--vermilion)); color:#fff;}
.win-bar{display:flex; align-items:center; gap:10px; padding:6px 10px; border-top:3px solid var(--navy); border-bottom:3px solid var(--navy);
  background:linear-gradient(#C8F76A,#5FD83A 55%,var(--lime)); color:#0B5A2A;}
.win-bar .tb{font:700 14px system-ui,sans-serif; letter-spacing:3px; flex:none;}
.addr{flex:1; min-width:0; background:#fff; border:2px solid var(--navy); padding:0 8px; font-size:18px; color:#0B5A2A; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.win-body{padding:20px; background:var(--aqua);}
.win-body.pink{background:var(--pink);}

.chip{border:2px solid var(--navy); border-radius:6px; background:#D8F3FF; color:var(--navy); font-size:14px; padding:3px 8px;}
.badge-done{background:var(--accent); border:2px solid var(--navy); border-radius:6px; color:var(--navy); font-size:11px; padding:4px 10px;}

/* Glossy aero buttons */
.btn-arcade,.btn-green,.btn-ghost{font-family:'Press Start 2P',monospace; border:3px solid var(--navy); border-radius:999px; transition:transform .08s ease, box-shadow .08s ease;}
.btn-arcade{font-size:12px; color:#fff; padding:12px 22px; box-shadow:0 5px 0 var(--night);
  background:linear-gradient(rgba(255,255,255,.16) 50%,rgba(255,255,255,0) 50%),linear-gradient(#0047B3,var(--blue));}
.btn-green{font-size:12px; color:var(--navy); padding:14px 26px; box-shadow:0 5px 0 #0B5A2A;
  background:linear-gradient(rgba(255,255,255,.35) 50%,rgba(255,255,255,0) 50%),linear-gradient(#7CE85A,var(--lime));}
.btn-arcade,.btn-green,.btn-ghost{text-align:center; line-height:1.4;}
.btn-ghost{font-size:10px; color:var(--ink); padding:9px 14px; box-shadow:0 4px 0 #6B7480; background:linear-gradient(#fff,var(--silver));}
.btn-arcade:hover,.btn-green:hover,.btn-ghost:hover{transform:translateY(2px);}
.btn-arcade:hover,.btn-green:hover{box-shadow:0 3px 0 var(--night);}
.btn-arcade:active,.btn-green:active{transform:translateY(5px); box-shadow:0 0 0 transparent;}

/* Scenery */
.cloud{position:absolute; background:linear-gradient(#fff 60%,#BFE9FF); border:3px solid var(--sky); border-radius:40px; opacity:.92;}
.star{position:absolute; color:var(--accent); font-size:14px; animation:twinkle 2.4s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.3} 50%{opacity:1}}
@keyframes drift{to{transform:translateX(-40px)}}
.parallax{animation:drift 14s ease-in-out infinite alternate;}
.bubble{position:absolute; border-radius:50%; border:2px solid rgba(255,255,255,.65);
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95),rgba(255,255,255,.2) 35%,rgba(0,191,255,.3) 72%);
  animation:bob 6s ease-in-out infinite alternate;}
@keyframes bob{to{transform:translateY(-18px)}}
.hills{position:absolute; left:0; bottom:0; width:100%; height:96px; background:linear-gradient(#9CF58A,var(--lime) 35%,#1E8E2E);
  clip-path:polygon(0 100%,0 62%,8% 62%,8% 46%,18% 46%,18% 30%,30% 30%,30% 46%,42% 46%,42% 62%,55% 62%,55% 40%,68% 40%,68% 24%,80% 24%,80% 46%,92% 46%,92% 62%,100% 62%,100% 100%);}
.moon-glow{filter:drop-shadow(0 0 10px rgba(255,231,76,.85));}

#cursor-dot{position:fixed; width:10px; height:10px; background:var(--accent); border:2px solid var(--navy); pointer-events:none; z-index:9999; transform:translate(-50%,-50%);}
.trail{position:fixed; width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.8); border:1px solid var(--picton); pointer-events:none; z-index:9998; transform:translate(-50%,-50%);}
@media (prefers-reduced-motion:reduce){ .parallax,.star,.bubble{animation:none !important;} .btn-arcade,.btn-green,.btn-ghost{transition:none !important;} }
@media (hover:none){ #cursor-dot,.trail{display:none;} }

/* Case-study additions */
.shot{image-rendering:auto; max-width:100%; height:auto; border:3px solid var(--navy); border-radius:6px; background:#fff; display:block; margin-inline:auto;}
.plain{border:0; background:none; border-radius:0;}
.pix{image-rendering:pixelated;}
.sh{font-family:'Press Start 2P',monospace; color:var(--navy); margin:0 0 14px; line-height:1.5;}
h2.sh{font-size:clamp(.9rem,.8rem + .5vw,1.15rem) !important;}
.kicker{font-family:'Press Start 2P',monospace; font-size:clamp(10px,.55rem + .35vw,12px); color:var(--blue); margin-bottom:8px;}
.sowhat{background:#FFF9C4; border:3px solid var(--navy); border-radius:8px; padding:12px 14px; margin-top:14px;}
.sowhat b{font-family:'Press Start 2P',monospace; font-weight:400; font-size:10px; background:var(--accent); border:2px solid var(--navy); border-radius:6px; padding:3px 8px; margin-right:8px; display:inline-block;}
.who{font-family:'Press Start 2P',monospace; font-size:10px; border:2px solid var(--navy); border-radius:6px; padding:2px 7px; margin-right:6px; display:inline-block; vertical-align:middle;}
.who.i{background:var(--accent); color:var(--navy);} .who.we{background:#B8F5A0; color:var(--navy);}
.tile{background:#fff; border:3px solid var(--navy); border-radius:8px; padding:16px;}
.quote{border-left:5px solid var(--aero); padding-left:12px; color:var(--sub);}
.gifbtn{display:block; position:relative; border:0; background:none; padding:0; cursor:pointer; margin-inline:auto; width:100%; max-width:260px;}
.gifbtn .playlbl{position:absolute; left:50%; bottom:12px; transform:translateX(-50%); font-family:'Press Start 2P',monospace; font-size:10px; background:var(--accent); color:var(--navy); border:3px solid var(--navy); border-radius:999px; padding:8px 12px; box-shadow:0 3px 0 var(--night);}
.phone{width:100%; max-width:260px; height:auto; object-fit:fill;}
.arrow{font-family:system-ui,sans-serif; font-weight:700; color:var(--blue);}
.read{margin:0 0 .75rem;}
ul.read{padding-left:1.1rem; list-style:square;}
.nob{border:0 !important; background:transparent !important; border-radius:0 !important;}
.sowhat{font-family:'Geist Pixel',ui-monospace,monospace; font-variation-settings:"ELSH" 1; font-size:1rem; line-height:1.6;}
.screens{display:flex; flex-wrap:wrap; justify-content:center; gap:20px;}
.screens img{flex:1 1 140px; max-width:190px; height:auto; margin:0;}
.avatar{display:flex; flex-direction:column; align-items:center; margin:0;}
.avatar img{display:block;} .avatar figcaption{text-align:center;}
.btn-arcade.ctr,.btn-ghost.ctr{display:inline-flex; align-items:center; justify-content:center; text-align:center; line-height:1; font-size:12px; padding:15px 24px;}
.screens{flex-wrap:nowrap !important; gap:16px !important; overflow-x:auto;}
.screens img{flex:1 1 0 !important; min-width:96px; max-width:none !important; width:auto; aspect-ratio:300/647; object-fit:fill; height:auto;}
a.inl{color:var(--blue); text-decoration:underline;}

/* MBTI page additions */
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
.scrollx{overflow-x:auto; border:3px solid var(--navy); border-radius:6px; background:#fff;}
.scrollx img{max-width:none; border:0; border-radius:0; margin:0;}
.screens.few img{flex:0 1 200px !important; max-width:200px !important;}
.placeholder{border:3px dashed var(--navy); border-radius:8px; background:#fff; padding:28px 16px; text-align:center; min-height:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;}
.placeholder b{font-family:'Press Start 2P',monospace; font-weight:400; font-size:11px; color:var(--blue);}
table.qoc{border-collapse:collapse; width:100%; min-width:760px; background:#fff;}
table.qoc th,table.qoc td{border:2px solid var(--navy); padding:10px; vertical-align:top; text-align:left;}
table.qoc th{background:#D8F3FF; font-family:'Press Start 2P',monospace; font-weight:400; font-size:10px; line-height:1.6; color:var(--navy);}
table.qoc td{font-family:'Geist Pixel',ui-monospace,monospace; font-variation-settings:"ELSH" 1; font-size:1rem; line-height:1.5;}
.pill{display:inline-block; font-family:'Press Start 2P',monospace; font-size:10px; border:2px solid var(--navy); border-radius:999px; padding:3px 9px; margin-bottom:6px; color:var(--navy);}
.pill.ok{background:#D2F5C6;} .pill.mid{background:#FFF1B8;} .pill.risk{background:#FFD3D3;} .pill.neu{background:#E3EAF6;}
.spot{box-shadow:0 0 0 3px var(--sky), 0 0 0 6px var(--accent), 0 0 0 8px var(--navy), 8px 10px 0 rgba(0,0,0,.35);}
.step-grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.step-grid .tile{padding:12px;}
.step-grid ul{margin:0; padding-left:1.1rem; list-style:square;}
dl.meta{display:grid; grid-template-columns:auto 1fr; gap:6px 16px;}
.avatar-sm{width:56px; height:56px; image-rendering:pixelated; flex:none;}
dl.meta{align-items:baseline;}
.step-grid{grid-template-columns:repeat(6,minmax(150px,1fr)); gap:12px; overflow-x:auto; padding-bottom:6px;}

/* CUTGroup page additions */
.rowscroll{display:flex; gap:14px; padding:14px;}
.rowscroll figure{flex:0 0 210px; margin:0;}
.rowscroll img{width:100%; aspect-ratio:3/4; object-fit:contain; background:#EEF3FA; border:2px solid var(--navy) !important; border-radius:4px !important; display:block;}
.rowscroll figcaption{font-family:'Geist Pixel',ui-monospace,monospace; font-variation-settings:"ELSH" 1; font-size:1rem; text-align:center; margin-top:6px; color:var(--ink);}
.pp{position:relative; display:inline-block;}
.pp.exp::after{content:"★"; position:absolute; right:-6px; top:-8px; width:22px; height:22px; border-radius:50%; background:var(--accent); border:2px solid var(--navy); color:var(--navy); font:700 12px/18px system-ui,sans-serif; text-align:center;}
.stat{font-family:'Press Start 2P',monospace; font-size:clamp(1.25rem,1rem + 1.2vw,1.75rem); color:var(--blue); line-height:1.3; margin:0 0 6px;}
.flow{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); counter-reset:step;}
.flow .tile{position:relative; padding-top:34px;}
.flow .tile::before{counter-increment:step; content:counter(step); position:absolute; top:-3px; left:-3px; width:34px; height:30px; background:var(--accent); border:3px solid var(--navy); border-radius:6px 0 8px 0; font:400 12px/24px 'Press Start 2P',monospace; text-align:center; color:var(--navy);}
.arrow-tag{font-family:'Press Start 2P',monospace; font-size:10px; background:#D8F3FF; border:2px solid var(--navy); border-radius:6px; padding:3px 8px; display:inline-block; margin-bottom:8px; color:var(--navy);}

/* About page additions */
.photo-slot{aspect-ratio:1/1; width:100%; max-width:320px; margin-inline:auto; min-height:0 !important;}
.tag-row{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px;}
a.btn-arcade,a.btn-green,a.btn-ghost,span.btn-ghost{text-decoration:none;}
.btn-off{opacity:1; cursor:not-allowed; border-style:dashed !important;}

/* Contact page additions */
.field{display:block; margin-bottom:16px;}
.field > span{display:block; font-family:'Press Start 2P',monospace; font-size:10px; color:var(--navy); margin-bottom:6px; line-height:1.6;}
.field input,.field select,.field textarea{width:100%; box-sizing:border-box; background:#fff; color:var(--ink); border:3px solid var(--navy); border-radius:6px; padding:10px 12px; font-family:'Geist Pixel',ui-monospace,monospace; font-variation-settings:"ELSH" 1; font-size:1rem; line-height:1.5;}
.field textarea{min-height:150px; resize:vertical;}
.emailbox{font-family:'Geist Pixel',ui-monospace,monospace; font-variation-settings:"ELSH" 1; font-size:1.125rem; background:#fff; border:3px solid var(--navy); border-radius:6px; padding:10px 12px; word-break:break-all; user-select:all;}
button.btn-arcade,button.btn-ghost,button.btn-green{cursor:pointer;}
a.btn-arcade,a.btn-green,a.btn-ghost{text-decoration:none;}
#status{min-height:1.5em;}
</style>
<script>
/* Always open a page at the very top, even when the visitor comes back to it (stops the browser from restoring the old scroll position) */
(function(){
  try{ if('scrollRestoration' in history) history.scrollRestoration='manual'; }catch(e){}
  function toTop(){ if(!location.hash) window.scrollTo({top:0,left:0,behavior:'instant'}); }
  toTop();
  window.addEventListener('DOMContentLoaded',toTop);
  window.addEventListener('load',function(){ toTop(); setTimeout(toTop,60); });
  window.addEventListener('pageshow',function(e){ if(e.persisted) toTop(); });   // page restored from the back/forward cache
})();
</script>

<script>
(function(){
  var EMAIL='mikangs@umich.edu';
  var status=document.getElementById('status');
  document.getElementById('copy').addEventListener('click',function(){
    function fallback(){
      var r=document.createRange(); r.selectNodeContents(document.getElementById('addr'));
      var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
      status.textContent='Address selected. Press Ctrl+C (or Cmd+C) to copy.';
    }
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(EMAIL).then(function(){status.textContent='Copied! Paste it into your email app.';},fallback);
      }else{fallback();}
    }catch(e){fallback();}
  });
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(window.matchMedia('(hover: none)').matches) return;
  var dot=document.getElementById('cursor-dot'), trails=[];
  document.addEventListener('mousemove',function(e){
    dot.style.left=e.clientX+'px'; dot.style.top=e.clientY+'px';
    var t=document.createElement('div'); t.className='trail'; t.style.left=e.clientX+'px'; t.style.top=e.clientY+'px';
    document.body.appendChild(t); trails.push(t);
    setTimeout(function(){ t.remove(); trails.shift(); },300);
    if(trails.length>12){ var o=trails.shift(); if(o) o.remove(); }
  });
})();
</script>
